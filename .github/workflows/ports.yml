name: "Ports"
on:
  push:
    branches: [main, zig-master]
  pull_request:
    branches: [main, zig-master]
  workflow_dispatch:

jobs:
  unit-test:
    name: "Unit Test"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      version: 0.17.0-dev.1857+3c46da14d

    - name: espressif/esp
      run: zig build test
      working-directory: port/espressif/esp

    - name: gigadevice/gd32
      run: zig build test
      working-directory: port/gigadevice/gd32

    - name: microchip/atmega
      run: zig build test
      working-directory: port/microchip/atmega

    - name: microchip/attiny
      run: zig build test
      working-directory: port/microchip/attiny

    - name: microchip/avrdx
      run: zig build test
      working-directory: port/microchip/avrdx

    - name: microchip/samd51
      run: zig build test
      working-directory: port/microchip/samd51

    - name: nordic/nrf5x
      run: zig build test
      working-directory: port/nordic/nrf5x

    - name: nxp/lpc
      run: zig build test
      working-directory: port/nxp/lpc

    - name: nxp/mcx
      run: zig build test
      working-directory: port/nxp/mcx

    - name: raspberrypi/rp2xxx
      run: zig build test
      working-directory: port/raspberrypi/rp2xxx

    - name: stmicro/stm32
      run: zig build test
      working-directory: port/stmicro/stm32

    - name: texasinstruments/msp430
      run: zig build test
      working-directory: port/texasinstruments/msp430

    - name: texasinstruments/mspm0
      run: zig build test
      working-directory: port/texasinstruments/mspm0

    - name: texasinstruments/tm4c
      run: zig build test
      working-directory: port/texasinstruments/tm4c

    - name: wch/ch32v
      run: zig build test
      working-directory: port/wch/ch32v

  build:
    name: "Build"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      version: 0.17.0-dev.1857+3c46da14d

    - name: espressif/esp
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/espressif/esp

    - name: gigadevice/gd32
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/gigadevice/gd32

    - name: microchip/atmega
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/microchip/atmega

    - name: microchip/attiny
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/microchip/attiny

    - name: microchip/avrdx
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/microchip/avrdx

    - name: microchip/samd51
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/microchip/samd51

    - name: nordic/nrf5x
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/nordic/nrf5x

    - name: nxp/lpc
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/nxp/lpc

    - name: nxp/mcx
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/nxp/mcx

    - name: raspberrypi/rp2xxx
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/raspberrypi/rp2xxx

    - name: stmicro/stm32
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/stmicro/stm32

    - name: texasinstruments/msp430
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/texasinstruments/msp430

    - name: texasinstruments/mspm0
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/texasinstruments/mspm0

    - name: texasinstruments/tm4c
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/texasinstruments/tm4c

    - name: wch/ch32v
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/wch/ch32v

    - name: no_hal/stm32_l031
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/no_hal/stm32_l031


  avr32dd20-sources:
    name: "AVR32DD20 source provenance"
    runs-on: ubuntu-latest
    schedule:
      # Weekly; Microchip availability must never break normal builds.
      - cron: "17 6 * * 1"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify vendored ATDF against pinned hash
        run: ./scripts/verify_avr32dd20_sources.sh
      - name: Verify pack from Microchip (download + hash + extraction)
        run: WITH_PACK=1 ./scripts/verify_avr32dd20_sources.sh
      - name: Live citation URL validation
        run: ONLINE=1 ./scripts/check_avr32dd20_citations.sh
